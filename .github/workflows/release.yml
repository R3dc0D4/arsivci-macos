name: Arşivci Preview Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout tagged sources
        uses: actions/checkout@v4

      - name: Fetch 7-Zip engine
        run: SEVENZIP_VERSION=2604 ./fetch-tools.sh

      - name: Build universal macOS app and run tests
        run: ./build.sh

      - name: Confirm application version
        shell: bash
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' 'build/Arşivci.app/Contents/Info.plist')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "v$version" = "$GITHUB_REF_NAME"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Package and verify DMG, ZIP, checksums
        run: ./package-release.sh

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged"
            exit 0
          fi
          gh release create "$tag" \
            dist/Arsivci-*.dmg \
            dist/Arsivci-*.zip \
            dist/Arsivci-*.sha256 \
            --target "$GITHUB_SHA" \
            --title "Arşivci $tag (test)" \
            --notes-file RELEASE_NOTES.md \
            --prerelease
